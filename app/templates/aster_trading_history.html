<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AsterTradingHistory - zzCatBoktoshiTradingBot</title>
    <style>
      :root { --bg:#121212; --panel:#1a1a1a; --line:#2d2d2d; --text:#e8e8e8; --muted:#9e9e9e; --teal:#82d2ca; --gold:#d8b77a; }
      *{box-sizing:border-box}
      body{margin:0;background:radial-gradient(circle at top right,#232323 0,var(--bg) 62%);color:var(--text);font-family:"IBM Plex Sans","Segoe UI",sans-serif}
      .page{max-width:1450px;margin:0 auto;padding:16px}
      .nav{display:flex;justify-content:space-between;align-items:center;border:1px solid var(--line);border-radius:10px;background:#171717;padding:10px 12px}
      .title{font-size:24px;font-weight:700}
      .links{display:flex;gap:10px;flex-wrap:wrap}
      .links a{color:var(--muted);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:7px 10px}
      .links a.active{color:#ffd2a0;border-color:#e29a4b}
      .card{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,#1b1b1b 0%,#161616 100%);padding:14px;margin-top:12px}
      .toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
      select,input,button{border:1px solid var(--line);border-radius:8px;background:#242424;color:var(--text);padding:8px 10px}
      button{cursor:pointer}
      .summary{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
      .box{border:1px solid var(--line);border-radius:9px;padding:8px;background:#181818}
      .box span{display:block;color:var(--muted);font-size:12px}
      .box strong{font-size:20px}
      .up{color:#9be6b4}.down{color:#ff8f84}
      .chart{margin-top:10px;border:1px solid var(--line);border-radius:9px;background:#141414;padding:8px}
      .table-wrap{overflow:auto;max-height:460px;border:1px solid var(--line);border-radius:9px;margin-top:10px}
      table{width:100%;border-collapse:collapse;font-size:13px}
      th,td{border-bottom:1px solid #262626;padding:8px 7px;text-align:left}
      th{color:var(--muted)}
      .muted{color:var(--muted)}
      @media (max-width:1200px){.summary{grid-template-columns:1fr 1fr}}
    </style>
  </head>
  <body>
    <div class="page">
      <div class="nav">
        <div class="title">AsterTradingHistory</div>
        <div class="links">
          <a href="/">Dashboard</a><a href="/manual">Position Management</a><a href="/backtest">Backtest</a>
          <a href="/aster-chart">ASTER Chart</a><a href="/aster-trading">AsterTrading</a><a href="/aster-simple-trading">AsterSimpleTrading</a><a href="/aster-trading-history" class="active">AsterTradingHistory</a>
        </div>
      </div>

      <div class="card">
        <div class="toolbar">
          <label class="muted">Symbol</label><select id="f-symbol"><option value="">ALL</option></select>
          <label class="muted">Limit</label><select id="f-limit"><option>100</option><option selected>200</option><option>500</option></select>
          <button id="btn-refresh">Refresh</button>
        </div>

        <div class="summary" id="summary"></div>

        <div class="chart">
          <div class="muted" style="margin-bottom:6px">PnL Curve (Cumulative Realized)</div>
          <svg id="curve" viewBox="0 0 1000 260" width="100%" height="260" role="img" aria-label="PnL Curve"></svg>
        </div>

        <div id="table" class="table-wrap"></div>
      </div>
    </div>

    <script>
      const money=(n,d=2)=>Number(n||0).toLocaleString('en-US',{maximumFractionDigits:d});
      async function fetchJson(path){const r=await fetch(path);if(!r.ok)throw new Error(await r.text());return r.json();}
      function ts(t){const d=new Date(Number(t||0));return Number.isNaN(d.getTime())?'-':`${d.toLocaleDateString()} ${d.toLocaleTimeString()}`;}
      function renderSummary(s){
        const rows=[['Realized PnL',s.realized||0],['Total Trades',s.total||0],['Wins',s.wins||0],['Losses',s.losses||0],['Best / Worst',`${money(s.best)} / ${money(s.worst)}`]];
        document.getElementById('summary').innerHTML=rows.map(([k,v])=>`<div class="box"><span>${k}</span><strong class="${k==='Realized PnL'?(Number(v)>=0?'up':'down'):''}">${typeof v==='number'?money(v):v}</strong></div>`).join('');
      }
      function renderTable(items){
        if(!items.length){document.getElementById('table').innerHTML='<p class="muted" style="padding:10px">No closed trades found.</p>';return;}
        const head=['Time','Symbol','Type','Realized PnL','Asset','Ref'];
        const body=items.slice().reverse().map(it=>`<tr><td>${ts(it.time)}</td><td>${it.symbol}</td><td>${it.incomeType}</td><td class="${Number(it.realizedPnl||0)>=0?'up':'down'}">${money(it.realizedPnl)}</td><td>${it.asset||'-'}</td><td>${it.tradeId||'-'}</td></tr>`).join('');
        document.getElementById('table').innerHTML=`<table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${body}</tbody></table>`;
      }
      function renderCurve(curve){
        const svg=document.getElementById('curve');
        if(!curve.length){svg.innerHTML='<text x="20" y="30" fill="#9e9e9e">No curve data</text>';return;}
        const vals=curve.map(x=>Number(x.equity||0));
        const min=Math.min(...vals), max=Math.max(...vals); const span=(max-min)||1;
        const pts=curve.map((p,i)=>{const x=(i/(curve.length-1||1))*960+20; const y=220-((Number(p.equity)-min)/span)*180; return `${x},${y}`;}).join(' ');
        const zeroY=220-((0-min)/span)*180;
        svg.innerHTML=`<line x1="20" y1="${zeroY}" x2="980" y2="${zeroY}" stroke="#444"/><polyline fill="none" stroke="#82d2ca" stroke-width="3" points="${pts}"/>`;
      }
      async function loadSymbols(){
        const data=await fetchJson('/api/aster-trading/symbols');
        const sel=document.getElementById('f-symbol');
        sel.innerHTML='<option value="">ALL</option>'+((data.items||[]).map(s=>`<option value="${s}">${s}</option>`).join(''));
      }
      async function load(){
        const symbol=document.getElementById('f-symbol').value;
        const limit=document.getElementById('f-limit').value;
        const q=new URLSearchParams({limit:String(limit)}); if(symbol) q.set('symbol',symbol);
        const data=await fetchJson(`/api/aster-trading/history?${q.toString()}`);
        renderSummary(data.summary||{}); renderTable(data.items||[]); renderCurve(data.curve||[]);
      }
      document.getElementById('btn-refresh').addEventListener('click',()=>load().catch(console.error));
      document.getElementById('f-symbol').addEventListener('change',()=>load().catch(console.error));
      document.getElementById('f-limit').addEventListener('change',()=>load().catch(console.error));
      loadSymbols().then(()=>load()).catch(console.error);
    </script>
  </body>
 </html>
